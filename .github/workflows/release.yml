name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "World Studio $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: release
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: npm run setup
      - run: npm run package:${{ matrix.platform }}
      - name: Archive (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: Compress-Archive -Path "desktop/dist/World Studio-win32-x64" -DestinationPath "World-Studio-win32-x64.zip"
      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        run: tar -czf World-Studio-linux-x64.tar.gz -C desktop/dist-linux "World Studio-linux-x64"
      - run: gh release upload "$GITHUB_REF_NAME" World-Studio-*
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
